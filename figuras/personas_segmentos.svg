    <text x="222" y="232" text-anchor="middle" font-size="10" font-weight="800" fill="#c0392b">%</text>

    <line x1="20" y1="292" x2="280" y2="292" stroke="#00BA38" stroke-width="1.5" stroke-dasharray="4 4"/>
